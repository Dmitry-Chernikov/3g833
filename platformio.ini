[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
lib_extra_dirs = ~/Documents/Arduino/libraries
lib_deps =
;AS5048A @ 1.0.1
    adafruit/Adafruit RGB LCD Shield Library@^1.2.2
    vase7u/LiquidMenu@^1.6.0
